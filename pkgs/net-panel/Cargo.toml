[package]
name = "net-panel"
version = "0.1.0"
edition = "2024"
publish = false
description = "Wi-Fi and network panel for the waybar tray, backed by NetworkManager"

[dependencies]
async-channel = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_16"] }
gtk4-layer-shell = "0.8"
qrcode = { version = "0.14", default-features = false }
serde = "1"
zbus = "5.19"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

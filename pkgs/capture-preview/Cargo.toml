[package]
name = "capture-preview"
version = "0.1.0"
edition = "2024"
publish = false
description = "A screen recording's or screenshot's preview, with show in folder, convert to GIF or annotate, copy and delete"

[dependencies]
gif = "0.13"
gif-dispose = "5"
gtk = { package = "gtk4", version = "0.11", features = ["v4_16"] }
gtk4-layer-shell = "0.8"
